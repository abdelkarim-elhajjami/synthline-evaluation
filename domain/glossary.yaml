Functional: "A functional requirement is a requirement that specifies a function that a system or system component shall perform."
Quality: "A quality requirement defines a specific quality property of the entire system, a system component, a service, or a system function."
Constraint: "A constraint is a requirement that restricts the development of the system, and often also restricts the properties a system can offer."

Flexibility: "Capability of a product to be adapted to changes in its requirements, contexts of use, or system environment. Includes: Adaptability, Scalability, Installability, Replaceability."
Safety: "Capability of a product under defined conditions to avoid a state in which human life, health, property, or the environment is endangered. Includes: Operational constraint, Risk identification, Fail safe, Hazard warning, Safe integration."
FunctionalSuitability: "Capability of a product to provide functions that meet stated and implied needs of intended users when it is used under specified conditions. Includes: Functional completeness, Functional correctness, Functional appropriateness."
PerformanceEfficiency: "Capability of a product to perform its functions within specified time and throughput parameters and be efficient in the use of resources under specified conditions. Includes: Time behaviour, Resource utilisation, Capacity."
Compatibility: "Capability of a product to exchange information with other products, and/or to perform its required functions while sharing the same common environment and resources. Includes: Co-existence, Interoperability."
InteractionCapability: "Capability of a product to be interacted with by specified users to exchange information between a user and a system via the user interface to complete the intended task. Includes: Appropriateness recognisability, Learnability, Operability, User error protection, User engagement, Inclusivity."
Reliability: "Capability of a system, product or component to perform specified functions under specified conditions for a specified period of time. Includes: Faultlessness, Availability, Fault tolerance, Recoverability."
Security: "Capability of a product to protect information and data so that persons or other products or systems have the degree of data access appropriate to their types and levels of authorization. Includes: Confidentiality, Integrity, Non-repudiation, Accountability, Authenticity, Resistance."
Maintainability: "Capability of a product to be modified effectively and efficiently by intended maintainers. Includes: Modularity, Reusability, Analysability, Modifiability, Testability."

Cultural: "Originate from the cultural background of the system users."
Legal: "Originate from laws and standards."
Organisational: "Originate from organisational processes and guidelines."
Physical: "Originate from the environment the system shall operate in."
Project: "Originate from the development contract and/or the project definition."

BehavioralPerspective: "Defines system behaviour in terms of external stimuli, reactions, states, and state transitions."
DataPerspective: "Defines static data aspects: entities, relationships, attributes, and types."
FunctionalPerspective: "Defines system processes, data manipulation, and input-output flows."

Usage: "Focuses on aspects, characteristics, and context objects related to the usage of the system. Includes: usage patterns, people and other systems which directly or indirectly interact with the system."
Subject: "Focuses on aspects, characteristics, and context objects related to the information stored and processed by the system. Includes: persons, organisations, material assets, goods, and technical systems."
ITSystem: "Focuses on aspects, characteristics, and context objects of the IT infrastructure the system is going to be deployed and is going to operate in. Includes: hardware, communications platforms, other software systems, peripheral devices."
Development: "Focuses on aspects, characteristics, and context objects related to system development, including all kinds of development phases such as requirements engineering, design, implementation, deployment, operation, and maintenance."
Business: "Focuses on aspects, characteristics, and context objects related to the organisation(s) using the system, which have an impact on the definition of requirements for the system. Includes: business processes, product strategy, marketing strategy, financial department."
Innovation: "Focuses on exploring innovation potential, and on creating innovations for the system to be developed. Includes: novel technologies, competitor systems, user desires."
Society: "Focuses on the impact the system has on society, as well as the societal impacts on the system and its development. Includes: cultural aspects, human and ethical values, ecological and environmental aspects."
Technical: "Focuses on aspects, characteristics, and context objects related to technical and physical aspects which have an impact on the definition of the requirements for the system. Includes: geometrical dimensions, spatial aspects, weather conditions, physical laws."

WellFormed: "A well-formed requirement must be: Atomic (describes only a single capability), Complete (sufficiently describes stakeholders' need), Comprehensible (content is easy to understand), Consistent (statements do not contradict each other), Implementation Free (does not contain unnecessary constraints regarding architectural design), Unambiguous (can only be interpreted in a single way), and Verifiable (allows proving whether the implemented system fulfils it)."
Ambiguous: "An ambiguous requirement allows for different interpretations. Sources include lexical, syntactic, semantic, and referential ambiguity, or use of vague terms."
Incomplete: "A requirement is incomplete if it does not sufficiently describe the stakeholders' need."
NonAtomic: "A requirement is not atomic if it describes, for example, multiple isolated or merely loosely coupled capabilities."
NonVerifiable: "A requirement is non-verifiable if it is not possible to decide objectively whether the requirement is realised as defined or not (e.g., underspecified)."
ImplementationBound: "A requirement is implementation bound if it contains unnecessary constraints regarding the system's architectural design and its realisation."
Inconsistent: "A requirement is inconsistent if the statements within it contradict each other."
Incomprehensible: "A requirement is incomprehensible if its content is not easy to understand for the relevant stakeholders."

Ubiquitous: "The <system name> shall <system response>."
EventDriven: "When <optional preconditions> <trigger> the <system name> shall <system response>."
UnwantedBehavior: "If <optional preconditions> <trigger>, Then the <system name> shall <system response>."
StateDriven: "While <in a specific state> the <system name> shall <system response>."
OptionalFeature: "Where <feature is included> the <system name> shall <system response>."